<!DOCTYPE html>
<html>

<head>

  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- External JS libraries -->
  <!-- iOS Apple login -->

    src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"></script>

  <!-- Google login -->

  <!-- Stripe -->
  <script src="https://js.stripe.com/v3/"></script>

  <!-- HLS.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest" type="application/javascript"></script>

  <!-- ═════════════════
      SPLASH START
  ══════════════════ -->
  <style>
    /* ── Reset ── */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      height: -webkit-fill-available;
    }

    body {
      background: #000;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow: hidden;
      position: fixed;
      width: 100%;
    }

    /* ══════════════════════════════════════════════
       CINEMATIC SPLASH SCREEN (4-PHASE EXPERIENCE)
       Phase 1: Audio Equalizer / Soundwave
       Phase 2: Neon Laser Scan & Logo Reveal
       Phase 3: Concentric Radar Rings & Tagline 1
       Phase 4: Full Tagline & Smooth Exit
       100% GPU Layer (transform & opacity only)
    ══════════════════════════════════════════════ */
    #sp {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
      will-change: opacity;
      transition: opacity 0.75s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #sp.out {
      opacity: 0;
      pointer-events: none;
    }

    /* Ambient background gradient */
    #sp-bg-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(10, 25, 35, 0.65) 0%, #000000 70%);
      pointer-events: none;
    }

    /* ══════════════════════════════════════════════
       FASE 1: AUDIO EQUALIZER / SOUNDWAVE
    ══════════════════════════════════════════════ */
    #sp-equalizer {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(3px, 0.7vmin, 6px);
      height: 100px;
      z-index: 2;
      transition: opacity 0.35s ease, transform 0.35s ease;
      will-change: opacity, transform;
    }

    #sp-equalizer.fade-out {
      opacity: 0;
      transform: scale(0.85);
      pointer-events: none;
    }

    .eq-bar {
      width: clamp(3px, 0.55vmin, 4.5px);
      height: clamp(32px, 6vmin, 52px);
      border-radius: 999px;
      background: linear-gradient(180deg, #00e5ff 0%, #10b981 60%, #bafa34 100%);
      transform-origin: center center;
      will-change: transform;
    }

    @keyframes eqWave1 {
      0%   { transform: scaleY(0.20); }
      50%  { transform: scaleY(0.95); }
      100% { transform: scaleY(0.35); }
    }
    @keyframes eqWave2 {
      0%   { transform: scaleY(0.40); }
      50%  { transform: scaleY(0.18); }
      100% { transform: scaleY(1.00); }
    }
    @keyframes eqWave3 {
      0%   { transform: scaleY(0.75); }
      50%  { transform: scaleY(0.25); }
      100% { transform: scaleY(0.60); }
    }
    @keyframes eqWave4 {
      0%   { transform: scaleY(0.15); }
      50%  { transform: scaleY(0.70); }
      100% { transform: scaleY(0.25); }
    }

    .eb-1  { animation: eqWave1 0.75s ease-in-out infinite alternate; }
    .eb-2  { animation: eqWave2 0.85s ease-in-out -0.2s infinite alternate; }
    .eb-3  { animation: eqWave3 0.95s ease-in-out -0.4s infinite alternate; }
    .eb-4  { animation: eqWave4 0.65s ease-in-out -0.1s infinite alternate; }
    .eb-5  { animation: eqWave2 0.80s ease-in-out -0.5s infinite alternate; }
    .eb-6  { animation: eqWave1 0.90s ease-in-out -0.3s infinite alternate; }
    .eb-7  { animation: eqWave3 0.70s ease-in-out -0.6s infinite alternate; }
    .eb-8  { animation: eqWave4 0.85s ease-in-out -0.2s infinite alternate; }
    .eb-9  { animation: eqWave2 1.00s ease-in-out -0.4s infinite alternate; }
    .eb-10 { animation: eqWave1 0.78s ease-in-out -0.1s infinite alternate; }
    .eb-11 { animation: eqWave3 0.92s ease-in-out -0.5s infinite alternate; }
    .eb-12 { animation: eqWave2 0.82s ease-in-out -0.3s infinite alternate; }
    .eb-13 { animation: eqWave4 0.72s ease-in-out -0.6s infinite alternate; }
    .eb-14 { animation: eqWave1 0.88s ease-in-out -0.2s infinite alternate; }
    .eb-15 { animation: eqWave3 0.96s ease-in-out -0.4s infinite alternate; }
    .eb-16 { animation: eqWave2 0.76s ease-in-out -0.1s infinite alternate; }
    .eb-17 { animation: eqWave4 0.84s ease-in-out -0.5s infinite alternate; }
    .eb-18 { animation: eqWave1 0.90s ease-in-out -0.3s infinite alternate; }
    .eb-19 { animation: eqWave3 0.74s ease-in-out -0.6s infinite alternate; }
    .eb-20 { animation: eqWave2 0.86s ease-in-out -0.2s infinite alternate; }
    .eb-21 { animation: eqWave1 0.80s ease-in-out -0.4s infinite alternate; }

    /* ══════════════════════════════════════════════
       FASE 2, 3, 4: STAGE CONTAINER
    ══════════════════════════════════════════════ */
    #sp-stage {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 3;
    }

    #sp-stage.revealed {
      opacity: 1;
      pointer-events: auto;
    }

    /* Radial Ambient Glow */
    #sp-ambient-glow {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translate(-50%, -50%);
      width: clamp(260px, 50vmin, 420px);
      height: clamp(140px, 30vmin, 240px);
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(0, 229, 255, 0.18) 0%, rgba(186, 250, 52, 0.12) 45%, transparent 72%);
      filter: blur(28px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #sp-ambient-glow.active {
      opacity: 1;
    }

    /* ── Radar Concentric Rings (Fase 3 & 4) ── */
    #sp-radar {
      position: absolute;
      top: 48px;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 0;
      height: 0;
      pointer-events: none;
      z-index: 1;
    }

    .sp-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: clamp(180px, 35vmin, 300px);
      height: clamp(180px, 35vmin, 300px);
      border-radius: 50%;
      border: 1.5px solid rgba(0, 229, 255, 0.45);
      box-shadow: 0 0 14px rgba(0, 229, 255, 0.25), inset 0 0 14px rgba(0, 229, 255, 0.15);
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.25);
      pointer-events: none;
      will-change: transform, opacity;
    }

    @keyframes radarPulse {
      0% {
        transform: translate(-50%, -50%) scale(0.25);
        opacity: 0.85;
        border-color: rgba(0, 229, 255, 0.65);
      }
      45% {
        opacity: 0.40;
        border-color: rgba(186, 250, 52, 0.55);
      }
      100% {
        transform: translate(-50%, -50%) scale(2.85);
        opacity: 0;
        border-color: rgba(186, 250, 52, 0);
      }
    }

    .sp-ring.r1.pulse-1 {
      animation: radarPulse 2.8s cubic-bezier(0.12, 0.7, 0.3, 1) infinite;
    }
    .sp-ring.r2.pulse-2 {
      animation: radarPulse 2.8s cubic-bezier(0.12, 0.7, 0.3, 1) 0.65s infinite;
    }
    .sp-ring.r3.pulse-3 {
      animation: radarPulse 2.8s cubic-bezier(0.12, 0.7, 0.3, 1) 1.30s infinite;
    }

    /* ── Logo Box & Laser Scan (Fase 2) ── */
    #sp-logo-box {
      position: relative;
      width: clamp(170px, 38vmin, 270px);
      height: clamp(60px, 13vmin, 90px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
    }

    #sp-logo-img {
      width: 100%;
      height: auto;
      max-height: 100%;
      object-fit: contain;
      opacity: 0;
      filter: brightness(1.05) drop-shadow(0 0 20px rgba(186, 250, 52, 0.3));
      transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity;
    }

    #sp-logo-img.show {
      opacity: 1;
    }

    #sp-laser {
      position: absolute;
      top: -15%;
      bottom: -15%;
      width: 3px;
      left: -15%;
      opacity: 0;
      background: #bafa34;
      box-shadow: 0 0 10px 2px #bafa34, 0 0 24px 6px rgba(0, 229, 255, 0.85);
      border-radius: 999px;
      pointer-events: none;
      will-change: left, opacity;
    }

    @keyframes laserSweep {
      0% {
        left: -15%;
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      85% {
        opacity: 1;
      }
      100% {
        left: 115%;
        opacity: 0;
      }
    }

    #sp-laser.sweep {
      animation: laserSweep 0.85s cubic-bezier(0.35, 0, 0.25, 1) forwards;
    }

    /* ── Taglines (Fase 3 & 4) ── */
    #sp-taglines {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: clamp(20px, 4.5vmin, 32px);
      gap: clamp(2px, 0.6vmin, 6px);
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      z-index: 3;
    }

    .sp-tag-line {
      font-size: clamp(20px, 4.4vmin, 32px);
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
      line-height: 1.25;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }

    .sp-tag-line.show {
      opacity: 1;
      transform: translateY(0);
    }

    .sp-neon {
      color: #bafa34;
      text-shadow: 0 0 18px rgba(186, 250, 52, 0.6), 0 0 36px rgba(186, 250, 52, 0.25);
    }

    #sp-sub {
      margin-top: clamp(8px, 1.8vmin, 14px);
      font-size: clamp(9px, 1.8vmin, 12px);
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #8fa0b5;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }

    #sp-sub.show {
      opacity: 0.85;
      transform: translateY(0);
    }
  </style>
  <!-- ═════════════════
      SPLASH END
  ══════════════════ -->
</head>

<body>

  <!-- ═════════════════
      SPLASH START
  ══════════════════ -->
  <div id="sp">
    <!-- Ambient Background -->
    <div id="sp-bg-glow"></div>

    <!-- Fase 1: Audio Equalizer / Soundwave -->
    <div id="sp-equalizer">
      <span class="eq-bar eb-1"></span>
      <span class="eq-bar eb-2"></span>
      <span class="eq-bar eb-3"></span>
      <span class="eq-bar eb-4"></span>
      <span class="eq-bar eb-5"></span>
      <span class="eq-bar eb-6"></span>
      <span class="eq-bar eb-7"></span>
      <span class="eq-bar eb-8"></span>
      <span class="eq-bar eb-9"></span>
      <span class="eq-bar eb-10"></span>
      <span class="eq-bar eb-11"></span>
      <span class="eq-bar eb-12"></span>
      <span class="eq-bar eb-13"></span>
      <span class="eq-bar eb-14"></span>
      <span class="eq-bar eb-15"></span>
      <span class="eq-bar eb-16"></span>
      <span class="eq-bar eb-17"></span>
      <span class="eq-bar eb-18"></span>
      <span class="eq-bar eb-19"></span>
      <span class="eq-bar eb-20"></span>
      <span class="eq-bar eb-21"></span>
    </div>

    <!-- Fase 2, 3, 4: Stage with Radar, Laser, Logo, and Taglines -->
    <div id="sp-stage">
      <div id="sp-ambient-glow"></div>

      <!-- Fase 3: Concentric Radar Rings -->
      <div id="sp-radar">
        <div class="sp-ring r1"></div>
        <div class="sp-ring r2"></div>
        <div class="sp-ring r3"></div>
      </div>

      <!-- Fase 2: Logo Reveal with Neon Laser Sweep -->
      <div id="sp-logo-box">
        <img id="sp-logo-img" src="assets/appicon.png" alt="nexstream" width="280" height="90">
        <div id="sp-laser"></div>
      </div>

      <!-- Fase 3 & 4: Taglines -->
      <div id="sp-taglines">
        <span class="sp-tag-line line-1">Stream <span class="sp-neon">Everything.</span></span>
        <span class="sp-tag-line line-2">Miss <span class="sp-neon">Nothing.</span></span>
        <span id="sp-sub">Unlimited Entertainment Awaits</span>
      </div>
    </div>
  </div>
  <!-- ═════════════════
      SPLASH END
  ══════════════════ -->

  <!-- ═════════════════
      SPLASH REMOVAL & TIMELINE
  ══════════════════ -->
  <script>
    (function () {
      var eq = document.getElementById('sp-equalizer');
      var stage = document.getElementById('sp-stage');
      var glow = document.getElementById('sp-ambient-glow');
      var logo = document.getElementById('sp-logo-img');
      var laser = document.getElementById('sp-laser');
      var ring1 = document.querySelector('.sp-ring.r1');
      var ring2 = document.querySelector('.sp-ring.r2');
      var ring3 = document.querySelector('.sp-ring.r3');
      var line1 = document.querySelector('.sp-tag-line.line-1');
      var line2 = document.querySelector('.sp-tag-line.line-2');
      var sub = document.getElementById('sp-sub');

      /* ── 800ms: Equalizer fades out ──────────────────────────────── */
      setTimeout(function () {
        if (eq) eq.classList.add('fade-out');
      }, 800);

      /* ── 950ms: Stage reveals, laser sweeps across logo ──────────── */
      setTimeout(function () {
        if (stage) stage.classList.add('revealed');
        if (logo) logo.classList.add('show');
        if (laser) laser.classList.add('sweep');
        if (glow) glow.classList.add('active');
      }, 950);

      /* ── 1500ms: Radar rings pulse, Line 1 appears ───────────────── */
      setTimeout(function () {
        if (ring1) ring1.classList.add('pulse-1');
        if (ring2) ring2.classList.add('pulse-2');
        if (ring3) ring3.classList.add('pulse-3');
        if (line1) line1.classList.add('show');
      }, 1500);

      /* ── 2000ms: Line 2 appears ─────────────────────────────────── */
      setTimeout(function () {
        if (line2) line2.classList.add('show');
      }, 2000);

      /* ── 2400ms: Subtitle appears ────────────────────────────────── */
      setTimeout(function () {
        if (sub) sub.classList.add('show');
      }, 2400);

      /* ── Splash Dismissal ────────────────────────────────────────── */
      var flutterReady = false;
      var minTimeReached = false;
      var dismissed = false;

      function tryDismiss() {
        if (dismissed) return;
        if (flutterReady && minTimeReached) {
          dismissed = true;
          var sp = document.getElementById('sp');
          if (!sp) return;
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              sp.classList.add('out');
              setTimeout(function () {
                if (sp && sp.parentNode) sp.parentNode.removeChild(sp);
              }, 800);
            });
          });
        }
      }

      // Minimum display time (2.5s) so the signature animation finishes
      setTimeout(function () {
        minTimeReached = true;
        tryDismiss();
      }, 2500);

      function onFlutterReady() {
        flutterReady = true;
        tryDismiss();
      }

      window.addEventListener('flutter-first-frame', onFlutterReady);
      window.addEventListener('flutter-initialized', function () {
        setTimeout(onFlutterReady, 200);
      });

      // Safety fallback ONLY if Flutter engine was actually loaded/detected
      // (If opened standalone in browser without Flutter, splash stays visible and will not become blank)
      setTimeout(function () {
        if (window._flutter || document.querySelector("flutter-view, flt-glass-pane, flt-scene-host")) {
          flutterReady = true;
          minTimeReached = true;
          tryDismiss();
        }
      }, 8000);

    }());
  </script>

</body>
